# Compila el instalador de Windows en cada push a main y, cuando el último
# commit del push empieza por «Release x.y.z», publica una Release versionada:
#   - comprueba que el fichero VERSION coincide con x.y.z y propaga la versión
#     al resto de archivos del proyecto (commit automático),
#   - crea la etiqueta vx.y.z,
#   - publica la Release con un resumen de los cambios desde la última release
#     (nuevas funcionalidades, arreglos, eliminaciones y otros cambios),
#     agrupados por el tipo convencional del mensaje de cada commit.
name: Compilar instalador Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Clonar el repositorio (historial completo para el resumen de releases)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Garantizar WebView2 Runtime
        shell: pwsh
        run: |
          $instalador = "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
          try {
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $instalador
            Start-Process -FilePath $instalador -ArgumentList "/silent /install" -Wait
          } catch {
            Write-Host "No se pudo instalar WebView2 (se ignora: puede que ya este presente)."
          }

      - name: Instalar dependencias npm
        run: npm install

      - name: Detectar commit de release («Release x.y.z»)
        id: release
        shell: bash
        run: |
          mensaje="$(git log -1 --format=%s)"
          if [[ "$mensaje" =~ ^[Rr]elease[[:space:]]+v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Último commit de release: se publicará la versión v${BASH_REMATCH[1]}."
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Push normal: solo se compila el instalador, sin publicar Release."
          fi

      # Solo cuando el commit es de release: la versión sale del fichero VERSION
      # (fuente única de verdad) y se propaga al resto de ficheros del proyecto
      # para que el instalador salga con ese número.
      - name: Fijar la versión del release en los archivos del proyecto
        if: steps.release.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        working-directory: .
        run: |
          set -euo pipefail
          version_fichero="$(tr -d '[:space:]' < VERSION)"
          if [ "$version_fichero" != "$VERSION" ]; then
            echo "::error::El fichero VERSION ($version_fichero) no coincide con la versión del commit de release ($VERSION)."
            exit 1
          fi
          node scripts/sync-version.mjs

      - name: Compilar el instalador .exe (NSIS)
        run: npm run tauri:build -- --bundles nsis

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: web/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # Solo cuando el último commit empieza por «Release x.y.z»: commit de
      # versión, etiqueta vx.y.z y Release con el resumen de cambios.
      - name: Crear Release y etiqueta vx.y.z con el resumen de cambios
        if: steps.release.outputs.version != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          TAG="v$VERSION"

          # 1) Commit del cambio de versión y push a main (el push con el token
          #    de GitHub no vuelve a lanzar este workflow).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "build: versión $VERSION" || true
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main

          # 2) Crear (o forzar) la etiqueta de la versión, de forma idempotente
          #    ante reintentos.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force

          # 3) Resumen de cambios desde la última release (etiqueta v* anterior),
          #    o desde el inicio del historial si es la primera. Se usa HEAD^ para
          #    no contarse a sí misma (la etiqueta se acaba de crear en HEAD).
          PREV="$(git for-each-ref --merged HEAD^ --format='%(refname:short)' --sort=-v:refname 'refs/tags/v*' | head -n 1 || true)"
          if [ -n "$PREV" ]; then
            RANGO="$PREV..HEAD"
          else
            INICIO="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            RANGO="$INICIO..HEAD"
            PREV="el inicio del historial"
          fi

          NOVEDADES=""; ARREGLOS=""; BORRADOS=""; OTROS=""
          while IFS= read -r linea; do
            # Se ignoran el propio commit «Release x.y.z» y el commit de versión automático.
            if [[ "$linea" =~ ^[Rr]elease[[:space:]] ]] || [[ "$linea" == "build: versión "* ]]; then
              continue
            fi
            if [[ "$linea" == *:* ]]; then
              tipo="${linea%%:*}"
              resto="${linea#*: }"
            else
              tipo=""
              resto="$linea"
            fi
            case "${tipo,,}" in
              feat*)                          NOVEDADES+="- $resto"$'\n' ;;
              fix*)                           ARREGLOS+="- $resto"$'\n' ;;
              remove*|delete*|drop*|elimin*)  BORRADOS+="- $resto"$'\n' ;;
              *)                              OTROS+="- $resto"$'\n' ;;
            esac
          done < <(git log --no-merges --pretty=format:%s "$RANGO")

          NOTAS="${RUNNER_TEMP}/notas-release.md"
          : > "$NOTAS"
          if [ -n "$NOVEDADES" ]; then printf '## ✨ Nuevas funcionalidades\n\n%s\n' "$NOVEDADES" >> "$NOTAS"; fi
          if [ -n "$ARREGLOS" ]; then printf '## 🐛 Arreglos\n\n%s\n' "$ARREGLOS" >> "$NOTAS"; fi
          if [ -n "$BORRADOS" ]; then printf '## 🗑️ Eliminaciones\n\n%s\n' "$BORRADOS" >> "$NOTAS"; fi
          if [ -n "$OTROS" ]; then printf '## 🧹 Otros cambios\n\n%s\n' "$OTROS" >> "$NOTAS"; fi
          if [ ! -s "$NOTAS" ]; then echo "_No hay cambios registrados desde la última release._" > "$NOTAS"; fi

          # 4) Publicar la Release con el instalador y las notas generadas
          gh release create "$TAG" \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            --title "Personal-Management $VERSION" \
            --notes-file "$NOTAS"
