[package]
name = "gestor-personal"
version = "0.0.1"
description = "Gestor de Personal — Calendario de turnos"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gestor_personal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
